name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: "Static checks (ruff.toml: real bugs and unused code)"
        run: pip install ruff && ruff check .
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install Qt (for the window tests; they skip without it)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          pip install PyQt6
      - name: Unit tests (simulator, no hardware)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m unittest discover -s tests -t . -v
      - name: Shell syntax
        run: for f in tools/*.sh tools/truesense-fast packaging/health.sh; do bash -n "$f"; done
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the kernel module for the runner's kernel (warnings on)
        run: |
          sudo apt-get update && sudo apt-get install -y linux-headers-$(uname -r)
          mkdir /tmp/m && cp kernel/truesense-wmi/truesense_wmi.c kernel/truesense-wmi/Makefile /tmp/m/ && cd /tmp/m && make KVER=$(uname -r) W=1
